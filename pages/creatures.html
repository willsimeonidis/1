<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creature AI World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/creatures.css">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>

  <div class="creature-header">
    <h1>Creature AI World</h1>
    <button class="back-btn" onclick="goToPage('../index.html')">← Back</button>
  </div>

  <div class="creature-main">
    <canvas id="creature-canvas"></canvas>

    <div class="creature-panel">
      <h3>Spawn</h3>
      <button class="creature-btn" data-spawn="basic">Basic Creature</button>
      <button class="creature-btn" data-spawn="fast">Fast Creature</button>
      <button class="creature-btn" data-spawn="big">Big Creature</button>

      <h3>Actions</h3>
      <button class="creature-btn" data-action="food">Drop Food</button>
      <button class="creature-btn" data-action="scatter">Scatter All</button>
      <button class="creature-btn danger" data-action="clear">Clear All</button>
    </div>
  </div>

  <script src="../js/ai.js" defer></script>
  <script src="../js/engine.js" defer></script>
  <script src="../js/ui.js" defer></script>

</body>
</html>
