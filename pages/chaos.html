<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHAOS MODE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/chaos.css">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>

  <div id="chaos-app">

    <header class="chaos-header">
      <h1>CHAOS MODE</h1>
      <p>Everything. Everywhere. All at once.</p>

      <button class="back-btn" onclick="goToPage('../index.html')">← Back to Menu</button>
    </header>

    <main class="chaos-main">

      <canvas id="chaos-canvas"></canvas>

      <div class="chaos-panel">
        <h3>Spawn</h3>
        <button class="chaos-btn" data-chaos="creature">Creature</button>
        <button class="chaos-btn" data-chaos="block">Builder Block</button>
        <button class="chaos-btn" data-chaos="star">Star</button>
        <button class="chaos-btn" data-chaos="nebula">Nebula</button>
        <button class="chaos-btn" data-chaos="planet">Planet</button>

        <h3>Forces</h3>
        <button class="chaos-btn" data-chaos="explosion">Explosion</button>
        <button class="chaos-btn" data-chaos="gravity">Gravity Well</button>
        <button class="chaos-btn" data-chaos="wind">Cosmic Wind</button>

        <h3>System</h3>
        <button class="chaos-btn danger" data-chaos="clear">Clear All</button>
        <button class="chaos-btn danger" data-chaos="max">MAX CHAOS</button>
      </div>

    </main>

  </div>

  <script src="../js/chaos.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/engine.js" defer></script>

</body>
</html>
