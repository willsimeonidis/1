<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/sandbox.css">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>

  <div class="sandbox-header">
    <h1>Physics Sandbox</h1>
    <button class="back-btn" onclick="goToPage('../index.html')">← Back</button>
  </div>

  <div class="sandbox-main">
    <canvas id="sandbox-canvas"></canvas>

    <div class="sandbox-panel">
      <h3>Spawn</h3>
      <button class="sandbox-btn" data-spawn="ball">Ball</button>
      <button class="sandbox-btn" data-spawn="box">Box</button>
      <button class="sandbox-btn" data-spawn="bomb">Bomb</button>

      <h3>Actions</h3>
      <button class="sandbox-btn" data-action="gravity">Toggle Gravity</button>
      <button class="sandbox-btn danger" data-action="clear">Clear All</button>
    </div>
  </div>

  <script src="../js/physics.js" defer></script>
  <script src="../js/engine.js" defer></script>
  <script src="../js/ui.js" defer></script>

</body>
</html>
