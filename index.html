<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Element Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, Arial, sans-serif;
  background: #000;
  color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
h1 {
  margin-bottom: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#board {
  width: 90vw;
  max-width: 900px;
  aspect-ratio: 6 / 5;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 8px;
  background: #111;
  padding: 10px;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(255,255,255,0.1);
  position: relative;
  z-index: 2;
}
.button {
  border-radius: 8px;
  border: 2px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.button span {
  position: relative;
  z-index: 2;
}
.button::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.7;
  z-index: 1;
}

/* Base hover */
.button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

/* Texture styles */
.button[data-effect="water"]::before {
  background: linear-gradient(180deg, #3ac5ff, #004b8f);
}
.button[data-effect="fire"]::before {
  background: linear-gradient(180deg, #ff8a00, #ff0000);
}
.button[data-effect="tnt"]::before {
  background: repeating-linear-gradient(
    45deg,
    #b00000 0px,
    #b00000 6px,
    #400000 6px,
    #400000 12px
  );
}
.button[data-effect="slime"]::before {
  background: radial-gradient(circle at 20% 0%, #b6ff00, #2b7a00);
}
.button[data-effect="electric"]::before {
  background: radial-gradient(circle at 50% 0%, #00f7ff, #001b3f);
}
.button[data-effect="ice"]::before {
  background: linear-gradient(135deg, #e0f7ff, #4fb3ff);
}
.button[data-effect="wind"]::before {
  background: linear-gradient(90deg, #ffffff22, #ffffff55);
}
.button[data-effect="confetti"]::before {
  background: conic-gradient(#ff006e, #ffbe0b, #00f5d4, #8338ec, #ff006e);
}
.button[data-effect="rock"]::before {
  background: radial-gradient(circle at 10% 10%, #666, #222);
}
.button[data-effect="sparkles"]::before {
  background: radial-gradient(circle, #fff, #444);
}
.button[data-effect="tornado"]::before {
  background: radial-gradient(circle at 50% 0%, #888, #222);
}
.button[data-effect="fog"]::before {
  background: linear-gradient(180deg, #ffffff33, #000000aa);
}
.button[data-effect="volcano"]::before {
  background: linear-gradient(180deg, #ff4b1f, #1f0000);
}
.button[data-effect="magic"]::before {
  background: radial-gradient(circle at 20% 0%, #ff00ff, #12002f);
}
.button[data-effect="freeze"]::before {
  background: linear-gradient(135deg, #c8e6ff, #005b96);
}
.button[data-effect="nature"]::before {
  background: linear-gradient(135deg, #00c853, #1b5e20);
}
.button[data-effect="space"]::before {
  background: radial-gradient(circle at 10% 10%, #fff, #000);
}
.button[data-effect="gear"]::before {
  background: repeating-linear-gradient(90deg, #555 0px, #555 4px, #222 4px, #222 8px);
}
.button[data-effect="storm"]::before {
  background: linear-gradient(180deg, #444, #000);
}
.button[data-effect="colorburst"]::before {
  background: conic-gradient(#ff0000, #00ff00, #0000ff, #ffff00, #ff00ff, #00ffff);
}
.button[data-effect="crystal"]::before {
  background: linear-gradient(135deg, #e3f2fd, #90caf9);
}
.button[data-effect="gold"]::before {
  background: linear-gradient(135deg, #ffd700, #b8860b);
}
.button[data-effect="brick"]::before {
  background: repeating-linear-gradient(
    0deg,
    #8b0000 0px,
    #8b0000 10px,
    #5a0000 10px,
    #5a0000 20px
  );
}
.button[data-effect="wood"]::before {
  background: linear-gradient(90deg, #8d6e63, #5d4037);
}
.button[data-effect="fireworks"]::before {
  background: radial-gradient(circle at 10% 10%, #ffeb3b, #000);
}
.button[data-effect="snake"]::before {
  background: repeating-linear-gradient(
    45deg,
    #2e7d32 0px,
    #2e7d32 6px,
    #1b5e20 6px,
    #1b5e20 12px
  );
}
.button[data-effect="blackhole"]::before {
  background: radial-gradient(circle, #000, #000, #111);
}
.button[data-effect="rainbow"]::before {
  background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
}
.button[data-effect="jet"]::before {
  background: linear-gradient(180deg, #ffffff, #000000);
}
.button[data-effect="smoke"]::before {
  background: linear-gradient(180deg, #bbbbbb, #000000);
}

/* Active border */
.button.active {
  border-color: #fff;
}

/* Full-screen effect layer */
#effect-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

/* Generic particles container */
.effect {
  position: absolute;
  inset: 0;
}

/* WATER */
.effect-water {
  background: linear-gradient(180deg, #3ac5ff55, #004b8fdd);
  animation: water-flow 2.5s linear infinite;
}
@keyframes water-flow {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(0%); }
}

/* LAVA (volcano / lava style) */
.effect-lava {
  background: linear-gradient(180deg, #ff8a00dd, #4a0000ff);
  animation: lava-drip 3s linear infinite;
}
@keyframes lava-drip {
  0% { transform: translateY(-100%); filter: blur(0px); }
  100% { transform: translateY(0%); filter: blur(2px); }
}

/* CONFETTI */
.effect-confetti {
  background: transparent;
}
.confetti-piece {
  position: absolute;
  width: 8px;
  height: 14px;
  border-radius: 2px;
  animation: confetti-fall 2s linear infinite;
}
@keyframes confetti-fall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* TORNADO */
.effect-tornado {
  background: transparent;
}
.tornado-core {
  position: absolute;
  width: 120px;
  height: 200px;
  border-radius: 50% 50% 10% 10%;
  border: 4px solid #bbbbbb55;
  left: -150px;
  top: 20vh;
  animation: tornado-move 4s linear infinite, tornado-spin 1s linear infinite;
}
@keyframes tornado-move {
  0% { transform: translateX(0); }
  100% { transform: translateX(120vw); }
}
@keyframes tornado-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* LIGHTNING */
.effect-lightning {
  background: transparent;
  animation: lightning-flash 0.4s linear infinite;
}
@keyframes lightning-flash {
  0%, 100% { background: transparent; }
  50% { background: rgba(255,255,255,0.3); }
}
.lightning-bolt {
  position: absolute;
  width: 4px;
  height: 80px;
  background: #fff;
  transform: skewX(-20deg);
  box-shadow: 0 0 12px #fff;
  animation: bolt-strike 0.4s linear infinite;
}
@keyframes bolt-strike {
  0% { opacity: 0; transform: translateY(-20vh) skewX(-20deg); }
  50% { opacity: 1; transform: translateY(20vh) skewX(-20deg); }
  100% { opacity: 0; transform: translateY(60vh) skewX(-20deg); }
}

/* FIRE */
.effect-fire {
  background: transparent;
}
.flame {
  position: absolute;
  width: 30px;
  height: 60px;
  border-radius: 50% 50% 20% 20%;
  background: radial-gradient(circle at 50% 0%, #ffff00, #ff0000);
  bottom: -60px;
  animation: flame-rise 1.5s ease-in-out infinite;
}
@keyframes flame-rise {
  0% { transform: translateY(0) scale(0.8); opacity: 0.2; }
  50% { transform: translateY(-40vh) scale(1.1); opacity: 1; }
  100% { transform: translateY(-80vh) scale(0.6); opacity: 0; }
}

/* SMOKE */
.effect-smoke {
  background: transparent;
}
.smoke-puff {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffffaa, #00000000);
  bottom: -40px;
  animation: smoke-rise 3s linear infinite;
}
@keyframes smoke-rise {
  0% { transform: translateY(0) scale(0.6); opacity: 0.2; }
  100% { transform: translateY(-80vh) scale(1.4); opacity: 0; }
}

/* BLACK HOLE */
.effect-blackhole {
  background: radial-gradient(circle, #000000, #000000, #111111);
  animation: blackhole-pull 2.5s ease-in-out infinite;
}
@keyframes blackhole-pull {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* RAINBOW FLOOD */
.effect-rainbow {
  background: linear-gradient(180deg, red, orange, yellow, green, blue, indigo, violet);
  animation: rainbow-flow 3s linear infinite;
}
@keyframes rainbow-flow {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(0%); }
}

/* SPACE WARP */
.effect-space {
  background: radial-gradient(circle at 50% 50%, #ffffff22, #000000ff);
  animation: space-warp 4s linear infinite;
}
@keyframes space-warp {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* ELECTRIC */
.effect-electric {
  background: radial-gradient(circle at 50% 0%, #00f7ff55, #000000ff);
  animation: electric-pulse 0.8s linear infinite;
}
@keyframes electric-pulse {
  0% { filter: brightness(1); }
  50% { filter: brightness(2); }
  100% { filter: brightness(1); }
}

/* ICE / FREEZE */
.effect-ice, .effect-freeze {
  background: radial-gradient(circle at 50% 50%, #e0f7ffaa, #001b3fff);
  animation: ice-crack 3s linear infinite;
}
@keyframes ice-crack {
  0% { filter: blur(0px); }
  50% { filter: blur(2px); }
  100% { filter: blur(0px); }
}

/* ROCK */
.effect-rock {
  background: radial-gradient(circle at 50% 50%, #555, #111);
}

/* GOLD */
.effect-gold {
  background: linear-gradient(135deg, #ffd700, #b8860b);
}

/* SIMPLE PULSE EFFECTS FOR OTHERS */
.effect-simple-pulse {
  background: rgba(255,255,255,0.05);
  animation: simple-pulse 1.5s ease-in-out infinite;
}
@keyframes simple-pulse {
  0% { background: rgba(255,255,255,0.05); }
  50% { background: rgba(255,255,255,0.25); }
  100% { background: rgba(255,255,255,0.05); }
}
</style>
</head>
<body>
<h1>Element Board</h1>
<div id="board">
  <!-- Row 1 -->
  <div class="button" data-effect="water"><span>Water</span></div>
  <div class="button" data-effect="fire"><span>Fire</span></div>
  <div class="button" data-effect="tnt"><span>TNT</span></div>
  <div class="button" data-effect="slime"><span>Slime</span></div>
  <div class="button" data-effect="electric"><span>Electric</span></div>
  <div class="button" data-effect="ice"><span>Ice</span></div>

  <!-- Row 2 -->
  <div class="button" data-effect="wind"><span>Wind</span></div>
  <div class="button" data-effect="confetti"><span>Confetti</span></div>
  <div class="button" data-effect="rock"><span>Rock</span></div>
  <div class="button" data-effect="sparkles"><span>Sparkles</span></div>
  <div class="button" data-effect="tornado"><span>Tornado</span></div>
  <div class="button" data-effect="fog"><span>Fog</span></div>

  <!-- Row 3 -->
  <div class="button" data-effect="volcano"><span>Volcano</span></div>
  <div class="button" data-effect="magic"><span>Magic</span></div>
  <div class="button" data-effect="freeze"><span>Freeze Blast</span></div>
  <div class="button" data-effect="nature"><span>Nature Burst</span></div>
  <div class="button" data-effect="space"><span>Space Warp</span></div>
  <div class="button" data-effect="gear"><span>Gear Spin</span></div>

  <!-- Row 4 -->
  <div class="button" data-effect="storm"><span>Lightning Storm</span></div>
  <div class="button" data-effect="colorburst"><span>Color Burst</span></div>
  <div class="button" data-effect="crystal"><span>Crystal</span></div>
  <div class="button" data-effect="gold"><span>Gold</span></div>
  <div class="button" data-effect="brick"><span>Brick</span></div>
  <div class="button" data-effect="wood"><span>Wood</span></div>

  <!-- Row 5 -->
  <div class="button" data-effect="fireworks"><span>Fireworks</span></div>
  <div class="button" data-effect="snake"><span>Snake Slither</span></div>
  <div class="button" data-effect="blackhole"><span>Black Hole</span></div>
  <div class="button" data-effect="rainbow"><span>Rainbow Flood</span></div>
  <div class="button" data-effect="jet"><span>Jet Blast</span></div>
  <div class="button" data-effect="smoke"><span>Smoke Puff</span></div>
</div>

<div id="effect-layer"></div>

<script>
const board = document.getElementById("board");
const effectLayer = document.getElementById("effect-layer");
let activeEffect = null;

const effectMap = {
  water: "effect-water",
  fire: "effect-fire",
  tnt: "effect-simple-pulse",
  slime: "effect-simple-pulse",
  electric: "effect-electric",
  ice: "effect-ice",
  wind: "effect-simple-pulse",
  confetti: "effect-confetti",
  rock: "effect-rock",
  sparkles: "effect-simple-pulse",
  tornado: "effect-tornado",
  fog: "effect-simple-pulse",
  volcano: "effect-lava",
  magic: "effect-simple-pulse",
  freeze: "effect-freeze",
  nature: "effect-simple-pulse",
  space: "effect-space",
  gear: "effect-simple-pulse",
  storm: "effect-lightning",
  colorburst: "effect-rainbow",
  crystal: "effect-simple-pulse",
  gold: "effect-gold",
  brick: "effect-simple-pulse",
  wood: "effect-simple-pulse",
  fireworks: "effect-simple-pulse",
  snake: "effect-simple-pulse",
  blackhole: "effect-blackhole",
  rainbow: "effect-rainbow",
  jet: "effect-simple-pulse",
  smoke: "effect-smoke"
};

function clearEffectLayer() {
  effectLayer.innerHTML = "";
  effectLayer.style.background = "transparent";
}

function createConfetti() {
  const container = document.createElement("div");
  container.className = "effect effect-confetti";
  const colors = ["#ff006e", "#ffbe0b", "#00f5d4", "#8338ec", "#ffffff"];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 1.5) + "s";
    container.appendChild(piece);
  }
  effectLayer.appendChild(container);
}

function createTornado() {
  const container = document.createElement("div");
  container.className = "effect effect-tornado";
  const core = document.createElement("div");
  core.className = "tornado-core";
  container.appendChild(core);
  effectLayer.appendChild(container);
}

function createLightning() {
  const container = document.createElement("div");
  container.className = "effect effect-lightning";
  for (let i = 0; i < 6; i++) {
    const bolt = document.createElement("div");
    bolt.className = "lightning-bolt";
    bolt.style.left = Math.random() * 100 + "vw";
    bolt.style.animationDelay = (Math.random() * 0.3) + "s";
    container.appendChild(bolt);
  }
  effectLayer.appendChild(container);
}

function createFire() {
  const container = document.createElement("div");
  container.className = "effect effect-fire";
  for (let i = 0; i < 10; i++) {
    const flame = document.createElement("div");
    flame.className = "flame";
    flame.style.left = Math.random() * 100 + "vw";
    flame.style.animationDelay = (Math.random() * 1.5) + "s";
    container.appendChild(flame);
  }
  effectLayer.appendChild(container);
}

function createSmoke() {
  const container = document.createElement("div");
  container.className = "effect effect-smoke";
  for (let i = 0; i < 8; i++) {
    const puff = document.createElement("div");
    puff.className = "smoke-puff";
    puff.style.left = Math.random() * 100 + "vw";
    puff.style.animationDelay = (Math.random() * 2.5) + "s";
    container.appendChild(puff);
  }
  effectLayer.appendChild(container);
}

function applySimpleEffect(className) {
  const container = document.createElement("div");
  container.className = "effect " + className;
  effectLayer.appendChild(container);
}

function applyEffect(effectKey) {
  clearEffectLayer();
  const className = effectMap[effectKey];
  if (!className) return;

  // Special cases with particles/objects
  if (effectKey === "confetti") {
    createConfetti();
  } else if (effectKey === "tornado") {
    createTornado();
  } else if (effectKey === "storm") {
    createLightning();
  } else if (effectKey === "fire") {
    createFire();
  } else if (effectKey === "smoke") {
    createSmoke();
  } else {
    applySimpleEffect(className);
  }
}

board.addEventListener("click", (e) => {
  const btn = e.target.closest(".button");
  if (!btn) return;
  const effectKey = btn.getAttribute("data-effect");

  // Toggle logic: clicking same button again turns everything off
  if (activeEffect === effectKey) {
    activeEffect = null;
    clearEffectLayer();
    document.querySelectorAll(".button").forEach(b => b.classList.remove("active"));
    return;
  }

  activeEffect = effectKey;
  document.querySelectorAll(".button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyEffect(effectKey);
});

// On refresh, everything is naturally reset (no extra code needed)
</script>
</body>
</html>
